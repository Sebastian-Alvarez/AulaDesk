# Configuración del sitio de documentación (Zensical).
# Construir: just docs-build · Vista previa local: just docs-serve

[project]
site_name = "AulaDesk"
site_description = "Documentación de AulaDesk, cliente de escritorio para Moodle"
site_url = "https://sebastian-alvarez.github.io/AulaDesk/"
repo_url = "https://github.com/Sebastian-Alvarez/AulaDesk"
repo_name = "AulaDesk"
copyright = "AulaDesk · Licencia Apache 2.0 · Proyecto independiente, sin afiliación con Moodle Pty Ltd"

nav = [
  { "Inicio" = "index.md" },
  { "Registro de decisiones" = "registro-de-decisiones.md" },
  { "ADR" = [
    "adr/index.md",
    { "0001 · Entorno de desarrollo" = "adr/0001-entorno-de-desarrollo.md" },
    { "0002 · Diagramas C4 como código" = "adr/0002-diagramas-c4-como-codigo.md" },
    { "0003 · Arquitectura" = "adr/0003-arquitectura.md" },
    { "0004 · Tecnología" = "adr/0004-tecnologia.md" },
    { "0005 · Login y sesión" = "adr/0005-login-y-sesion.md" },
    { "0006 · Vista de cursos y sitio real" = "adr/0006-vista-de-cursos-y-sitio-real.md" },
  ] },
  { "Diagramas" = [
    { "Arquitectura (C4)" = "https://sebastian-alvarez.github.io/AulaDesk/arquitectura/" },
    { "Login" = "diagramas/login.md" },
  ] },
  { "Validación" = [
    { "Fase 1 (2026-11-07)" = "validacion/fase-1.md" },
  ] },
]

[project.theme]
language = "es"
features = [
  "content.code.copy",
  "content.tooltips",
  "navigation.footer",
  "navigation.indexes",
  "navigation.instant",
  "navigation.path",
  "navigation.sections",
  "navigation.top",
  "navigation.tracking",
  "search.highlight",
  "toc.follow",
]

[[project.theme.palette]]
media = "(prefers-color-scheme)"
toggle.icon = "lucide/sun-moon"
toggle.name = "Cambiar a modo claro"

[[project.theme.palette]]
media = "(prefers-color-scheme: light)"
scheme = "default"
toggle.icon = "lucide/sun"
toggle.name = "Cambiar a modo oscuro"

[[project.theme.palette]]
media = "(prefers-color-scheme: dark)"
scheme = "slate"
toggle.icon = "lucide/moon"
toggle.name = "Usar la preferencia del sistema"

[project.markdown_extensions]
abbr = {}
admonition = {}
attr_list = {}
def_list = {}
footnotes = {}
md_in_html = {}
toc.permalink = true
# Anclas con tildes, iguales a las de GitHub, para que los índices funcionen en ambos
toc.slugify = { object = "pymdownx.slugs.slugify", kwds = { case = "lower" } }
pymdownx.betterem = {}
pymdownx.details = {}
pymdownx.highlight.anchor_linenums = true
pymdownx.highlight.pygments_lang_class = true
pymdownx.inlinehilite = {}
pymdownx.keys = {}
pymdownx.magiclink = {}
pymdownx.mark = {}
pymdownx.superfences.custom_fences = [
  { name = "mermaid", class = "mermaid", format = "pymdownx.superfences.fence_code_format" },
]
pymdownx.tabbed.alternate_style = true
pymdownx.tasklist.custom_checkbox = true
pymdownx.tilde = {}
