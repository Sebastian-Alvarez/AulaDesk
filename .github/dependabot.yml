# Actualizaciones automáticas de versiones fijadas (D-30).
version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: chore
      include: scope
    groups:
      cargo:
        patterns: ["*"]

  - package-ecosystem: rust-toolchain
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: chore
      include: scope

  - package-ecosystem: pre-commit
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: chore
      include: scope
    groups:
      hooks:
        patterns: ["*"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: ci
      include: scope
    groups:
      github-actions:
        patterns: ["*"]

  - package-ecosystem: uv
    directory: /tools/docs
    schedule:
      interval: weekly
    commit-message:
      prefix: docs
      include: scope
    groups:
      docs-tooling:
        patterns: ["*"]

  - package-ecosystem: docker-compose
    directory: /dev/structurizr
    schedule:
      interval: weekly
    commit-message:
      prefix: docs
      include: scope
