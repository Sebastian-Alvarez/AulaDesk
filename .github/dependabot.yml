# Actualizaciones automáticas de versiones fijadas (D-30).
# Se agregan cargo, hooks y la versión de Rust cuando existan en el repositorio.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: ci
      include: scope
    groups:
      github-actions:
        patterns: ["*"]

  - package-ecosystem: uv
    directory: /tools/docs
    schedule:
      interval: weekly
    commit-message:
      prefix: docs
      include: scope
    groups:
      docs-tooling:
        patterns: ["*"]

  - package-ecosystem: docker-compose
    directory: /dev/structurizr
    schedule:
      interval: weekly
    commit-message:
      prefix: docs
      include: scope
